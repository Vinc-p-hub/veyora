    <!-- Open Graph / Twitter — absolute URLs are filled in at runtime so they

    <meta name="format-detection" content="telephone=no" />

    <script>
      // International SEO head: canonical, hreflang alternates for every served
      // language, and the site-wide Organization + WebSite structured data.
      // Built from location.origin so a custom domain never leaves stale URLs.
      (function () {
        var origin = location.origin;
        var langs = ["en", "fr", "pt", "es", "ar"];
        function link(rel, href, hreflang) {
          var el = document.createElement("link");
          el.rel = rel;
          el.href = href;
          if (hreflang) el.hreflang = hreflang;
          document.head.appendChild(el);
        }
        function meta(attr, key, content) {
          var el = document.createElement("meta");
          el.setAttribute(attr, key);
          el.setAttribute("content", content);
          document.head.appendChild(el);
        }
        link("canonical", origin + "/");
        langs.forEach(function (l) {
          link("alternate", l === "en" ? origin + "/" : origin + "/?lang=" + l, l);
        });
        link("alternate", origin + "/", "x-default");
        meta("property", "og:url", origin + "/");
        meta("property", "og:locale", "en");
        langs.forEach(function (l) {
          if (l !== "en") meta("property", "og:locale:alternate", l);
        });

        var graph = {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "Organization",
              "@id": origin + "/#organization",
              name: "VEYRO",
              alternateName: "VEYRO Premium Electronics",
              url: origin + "/",
              description:
                "VEYRO is an international premium electronics marketplace offering smartphones, laptops, audio, gaming and smart home products from verified merchants, with transparent pricing and flexible installment plans.",
              slogan: "Premium electronics, paid your way.",
              areaServed: "Worldwide",
              logo: {
                "@type": "ImageObject",
                url: origin + "/favicon.svg",
                caption: "VEYRO",
              },
              image: origin + "/favicon.svg",
              knowsLanguage: langs,
              contactPoint: {
                "@type": "ContactPoint",
                contactType: "customer support",
                url: origin + "/contact",
                availableLanguage: langs,
              },
            },
            {
              "@type": "WebSite",
              "@id": origin + "/#website",
              name: "VEYRO",
              url: origin + "/",
              inLanguage: langs,
              publisher: { "@id": origin + "/#organization" },
              potentialAction: {
                "@type": "SearchAction",
                target: origin + "/category?q={search_term_string}",
                "query-input": "required name=search_term_string",
              },
            },
          ],
        };
        var s = document.createElement("script");
        s.type = "application/ld+json";
        s.setAttribute("data-seo-site", "true");
        s.textContent = JSON.stringify(graph);
        document.head.appendChild(s);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
