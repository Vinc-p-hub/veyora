name: Deploy Supabase Edge Functions
# Deploys every function under supabase/functions on push to main.
# Setup (once): GitHub → Settings → Secrets and variables → Actions → add SUPABASE_ACCESS_TOKEN
# (create it at https://supabase.com/dashboard/account/tokens).
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fulpkoenkmxwttgwioci
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: "Deploy functions (public endpoints, each verifies its callers)"
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            supabase functions deploy "$name" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
